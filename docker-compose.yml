version = "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pan_africa_pay_postgres
    environment:
      POSTGRES_DB: pan_africa_pay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pan_africa_pay_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Kotani Pay mock server for local development
  kotani-mock:
    image: ghcr.io/wiremock/wiremock:3.5
    container_name: pan_africa_pay_kotani_mock
    ports:
      - "8080:8080"
    volumes:
      - ./mock/kotani:/home/wiremock
    command: ["--verbose", "--root-dir", "/home/wiremock"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data: