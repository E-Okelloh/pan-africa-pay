[package]
name = "pan-africa-pay-api"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[[bin]]
name = "pan-africa-pay-api"
path = "src/main.rs"

[dependencies]
pan-africa-pay-domain = { path = "../domain" }
pan-africa-pay-storage = { path = "../storage" }
pan-africa-pay-mpesa = { path = "../mpesa" }
pan-africa-pay-kotani = { path = "../kotani" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
figment = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7", "serde", "fast-rng"] }
anyhow = { workspace = true }
parking_lot = { workspace = true }
dotenvy = "0.15"

[dev-dependencies]
http-body-util = "0.1"
tower = { workspace = true, features = ["util"] }
sqlx = { workspace = true }
deadpool-redis = { workspace = true }