[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/storage",
    "crates/mpesa",
    "crates/kotani",
    "crates/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["E-Okelloh"]
rust-version = "1.97"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full", "tracing"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.8", features = ["v4", "v7", "serde", "fast-rng"] }
rust_decimal = { version = "1.35", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "rust_decimal", "json"] }
redis = { version = "1.5", features = ["tokio-comp", "connection-manager"] }
deadpool-redis = { version = "0.23", features = ["rt_tokio_1"] }
axum = { version = "0.7", features = ["extra-headers"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors", "classify"] }
governor = { version = "0.6", features = ["axum"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "decimal", "uuid"] }
utoipa-swagger-ui = "5"
figment = { version = "0.12", features = ["serde", "toml", "env"] }
secrecy = "0.8"
zeroize = "1.8"
blake3 = "1.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2"] }
anyhow = "1.0"
once_cell = "1.19"
parking_lot = "0.12"

[workspace.lints]
rust.unused_crate_dependencies = "warn"
rust.unused_imports = "warn"
rust.unused_variables = "warn"